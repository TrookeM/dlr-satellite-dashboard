name: Despliegue al Servidor Público 🌍

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Clonar el código
        uses: actions/checkout@v4

      - name: ⚙️ 2. Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 3. Instalar dependencias y Compilar
        run: |
          npm install
          npm run build

      - name: 🚀 4. Desplegar al VPS Público via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 
          source: "dist/*"
          target: "/root/dlr-satellite-dashboard"
          strip_components: 1